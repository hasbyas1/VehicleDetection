; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================
; KONFIGURASI GLOBAL (Dipakai oleh kedua mode)
; ============================================================
[env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
lib_deps = knolleary/PubSubClient@^2.8
monitor_speed = 115200

; ============================================================
; OPSI 1: UPLOAD LEWAT PORT KANAN (UART / CH340)
; -> Pilih ini kalau colok di port UART
; -> Paling stabil, Serial Monitor langsung jalan
; ============================================================
[env:jalur_kanan_uart]
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0  ; Matikan USB Native agar teks lari ke UART

; ============================================================
; OPSI 2: UPLOAD LEWAT PORT KIRI (OTG / NATIVE USB)
; -> Pilih ini kalau colok di port OTG
; -> Wajib setting ini agar Serial Monitor terbaca
; ============================================================
[env:jalur_kiri_otg]
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1  ; Hidupkan USB Native
    -DARDUINO_USB_MODE=1
